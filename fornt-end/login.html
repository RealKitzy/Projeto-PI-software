<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="auth-container">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-badge">🔥</div>
        <div>
          <h1>Login</h1>
          <p>Acesse seu painel</p>
        </div>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            required
          />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              required
              minlength="4"
            />
            <button type="button" id="toggleSenha" class="toggle-btn" aria-label="Mostrar senha">
              Mostrar
            </button>
          </div>
        </div>

        <div class="options">
          <label class="checkbox">
            <input type="checkbox" id="rememberMe" />
            <span>Lembrar e-mail</span>
          </label>

          <a href="#" class="link-help" aria-disabled="true" title="Opcional para implementar depois">Esqueci minha senha</a>
        </div>

        <button type="submit" id="btnEntrar" class="btn-primary">
          Entrar
        </button>

        <p id="msg" class="msg" role="status" aria-live="polite"></p>

        <p class="footer-link">
          Não tem conta?
          <a href="./cadastro.html">Cadastre-se</a>
        </p>
      </form>
    </section>
  </main>

  <script src="./login.js"></script>
</body>
</html>
