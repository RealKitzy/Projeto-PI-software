<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Cadastro</title><link rel="stylesheet" href="./cadastro.css" /></head><body><div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div><main class="auth-container"><section class="auth-card"><div class="brand"><div class="brand-badge">🧾</div><div><h1>Cadastro</h1><p>Crie sua conta para acessar o sistema</p></div></div><form id="cadastroForm" class="auth-form" autocomplete="on"><div class="field"><label for="nome">Nome completo</label><input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required /></div><div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required /></div><div class="field"><label for="perfil">Perfil de usuário</label><select id="perfil" name="perfil" required><option value="">Selecione seu perfil</option><option value="gerador">Gerador</option><option value="catador_cooperativa">Catador/Cooperativa</option></select></div><div class="field"><label for="senha">Senha</label><div class="password-wrap"><input type="password" id="senha" name="senha" placeholder="Crie uma senha" required minlength="4" /><button type="button" id="toggleSenha" class="toggle-btn" aria-label="Mostrar senha">Mostrar</button></div></div><div class="field"><label for="confirmarSenha">Confirmar senha</label><div class="password-wrap"><input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita sua senha" required minlength="4" /><button type="button" id="toggleConfirmarSenha" class="toggle-btn" aria-label="Mostrar senha">Mostrar</button></div></div><button type="submit" id="btnCadastrar" class="btn-primary">Criar conta</button><p id="msg" class="msg" role="status" aria-live="polite"></p><p class="footer-link">Já tem conta? <a href="../login/login.html">Entrar</a></p></form></section></main><script src="./cadastro.js"></script></body></html>
