<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="./cadastro.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <header class="head">
        <h1>Criar conta</h1>
        <p>Cadastro rápido, com fundo confortável.</p>
      </header>

      <form id="cadastroForm" class="form" autocomplete="on">
        <label class="field">
          <span>Nome</span>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />
        </label>

        <label class="field">
          <span>E-mail</span>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required />
        </label>

        <label class="field">
          <span>Perfil</span>
          <select id="perfil" name="perfil" required>
            <option value="">Selecione</option>
            <option value="gerador">Gerador</option>
            <option value="catador_cooperativa">Catador/Cooperativa</option>
          </select>
        </label>

        <label class="field">
          <span>Senha</span>
          <div class="row">
            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6" />
            <button type="button" id="toggleSenha" class="ghost">Mostrar</button>
          </div>
        </label>

        <label class="field">
          <span>Confirmar senha</span>
          <div class="row">
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required minlength="6" />
            <button type="button" id="toggleConfirmarSenha" class="ghost">Mostrar</button>
          </div>
        </label>

        <button type="submit" id="btnCadastrar" class="btn">Criar conta</button>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>

        <p class="foot">
          Já tem conta?
          <a class="link" href="../login/login.html">Entrar</a>
        </p>
      </form>
    </section>
  </main>
  <script src="./cadastro.js"></script>
</body>
</html>
